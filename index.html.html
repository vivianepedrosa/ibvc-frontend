  <!-- FIREBASE ENGINE, AUTHENTICATION & PUSH NOTIFICATIONS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, GoogleAuthProvider, signInWithPopup, linkWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getMessaging, getToken, onMessage 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDR1KUWV-OmBzo3ESNUa8UKUbyWWp582nE",
      authDomain: "trab-de-t-i-salao.firebaseapp.com",
      projectId: "trab-de-t-i-salao",
      storageBucket: "trab-de-t-i-salao.firebasestorage.app",
      messagingSenderId: "1067653302843",
      appId: "1:1067653302843:web:0b56feebc1b996f49a6a1e",
      measurementId: "G-NX4B7N7YZ7"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const googleProvider = new GoogleAuthProvider();
      let messaging = null;

      try {
        messaging = getMessaging(app);
        onMessage(messaging, (payload) => {
          console.log('Notificação recebida em primeiro plano:', payload);
          const notificationTitle = payload.notification?.title || payload.data?.title || 'Louvor IBVC';
          const notificationOptions = {
            body: payload.notification?.body || payload.data?.body || 'Novo item postado no app!',
            icon: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=180&h=180&fit=crop&crop=faces'
          };
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(notificationTitle, notificationOptions);
          }
        });
      } catch (errMsg) {
        console.warn("FCM Messaging não suportado neste navegador/ambiente.", errMsg);
      }

      window.db = db;
      window.auth = auth;
      window.googleProvider = googleProvider;
      window.signInWithPopup = signInWithPopup;
      window.linkWithPopup = linkWithPopup;
      window.messaging = messaging;

      window.fs = {
        colUsers: collection(db, 'users'),
        colAvisos: collection(db, 'avisos'),
        colEscalas: collection(db, 'escalas'),
        colIndicacoes: collection(db, 'indicacoes'),

        async getUsers() {
          const snap = await getDocs(this.colUsers);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        },
        async getAvisos() {
          const snap = await getDocs(this.colAvisos);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        },
        async getEscalas() {
          const snap = await getDocs(this.colEscalas);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        },
        async getIndicacoes() {
          const snap = await getDocs(this.colIndicacoes);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        },
        async addUser(data) {
          const docRef = await addDoc(this.colUsers, data);
          return { id: docRef.id, ...data };
        },
        async addAviso(data) {
          return await addDoc(this.colAvisos, data);
        },
        async updateAviso(id, data) {
          await updateDoc(doc(db, 'avisos', id), data);
        },
        async addEscala(data) {
          return await addDoc(this.colEscalas, data);
        },
        async updateEscala(id, data) {
          await updateDoc(doc(db, 'escalas', id), data);
        },
        async addIndicacao(data) {
          return await addDoc(this.colIndicacoes, data);
        },
        async updateUser(id, data) {
          await updateDoc(doc(db, 'users', id), data);
        },
        async deleteAviso(id) {
          await deleteDoc(doc(db, 'avisos', id));
        },
        async deleteIndicacao(id) {
          await deleteDoc(doc(db, 'indicacoes', id));
        },
        async deleteEscala(id) {
          await deleteDoc(doc(db, 'escalas', id));
        },

        async initPushNotifications(userId, forceRequest = false) {
          if (!userId) return false;
          try {
            if ('serviceWorker' in navigator) {
              await navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(err => {
                console.log('SW registration fallback ou local:', err);
              });
            }

            if (forceRequest) {
              const permission = await Notification.requestPermission();
              if (permission === 'granted') {
                let currentToken = null;
                if (messaging) {
                  currentToken = await getToken(messaging, { 
                    vapidKey: 'BC-acaGViJZyY-bGoMa2GjEqS7imcPT556hFeHbtKERSnKhRNYHMot71RDLh-pUMQmJsh5Dea9iP0gm4qbMbEGU'
                  }).catch(e => console.warn("Erro ao obter token FCM:", e));
                }
                
                await this.updateUser(userId, { 
                  notificationsEnabled: true,
                  fcmToken: currentToken || 'web_permission_granted', 
                  lastPushTokenAt: new Date().toISOString() 
                });

                const user = state.users.find(u => u.id === userId);
                if (user) {
                  user.notificationsEnabled = true;
                  user.fcmToken = currentToken || 'web_permission_granted';
                }
                return true;
              }
            } else if ('Notification' in window && Notification.permission === 'granted') {
              let currentToken = null;
              if (messaging) {
                currentToken = await getToken(messaging, { 
                  vapidKey: 'BC-acaGViJZyY-bGoMa2GjEqS7imcPT556hFeHbtKERSnKhRNYHMot71RDLh-pUMQmJsh5Dea9iP0gm4qbMbEGU'
                }).catch(e => console.warn("Erro ao obter token FCM:", e));
              }
              await this.updateUser(userId, { 
                notificationsEnabled: true,
                fcmToken: currentToken || 'web_permission_granted', 
                lastPushTokenAt: new Date().toISOString() 
              });
              const user = state.users.find(u => u.id === userId);
              if (user) {
                user.notificationsEnabled = true;
                user.fcmToken = currentToken || 'web_permission_granted';
              }
              return true;
            }
          } catch (errPush) {
            console.warn("Erro ou falta de suporte para Push Notification:", errPush);
          }
          return false;
        }
      };
    } catch (e) {
      console.warn("Firestore não pôde inicializar diretamente, ativando fallback local.", e);
    }

    // Inicialização segura com Timeout
    window.initAppWithTimeout();
  </script>

  <script>
    const YOUTUBE_API_KEY = "AIzaSyCwi96XdPJnK3Vewwwiy7Ispl2u35opKXQ";
    let state = { users: [], avisos: [], escalas: [], indicacoes: [] };
    let currentStepEscala = 1;
    let editingEscalaId = null;
    let searchTimeout = null;
    let indSearchTimeout = null;
    let escalaDraft = { events: [], selectedInstruments: [], instrumental: {}, songs: [], vocalUserIds: [] };

    // --- GERENCIAMENTO DE TEMA (CLARO / ESCURO) ---
    function initTheme() {
      const savedTheme = localStorage.getItem('ibvc_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ibvc_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (icon) {
        if (isDark) {
          icon.className = 'ph ph-sun';
        } else {
          icon.className = 'ph ph-moon';
        }
      }
    }

    // --- SISTEMA DE NOTIFICAÇÃO LOCAL & DISPARO PARA DISPOSITIVOS ---
    async function sendPushNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, {
            body: body,
            icon: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=180&h=180&fit=crop&crop=faces'
          });
        } catch (e) {
          console.warn("Erro ao exibir notificação local:", e);
        }
      }

      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'BROADCAST_NOTIFICATION',
          title: title,
          body: body
        });
      }
    }

    function checkPushNotificationPermission() {
      const user = getCurrentUser();
      if (!user) return;

      const banner = document.getElementById('push-permission-banner');
      const dismissed = sessionStorage.getItem('ibvc_push_banner_dismissed');

      // Se o navegador suporta notificações e ainda não está concedido
      if ('Notification' in window) {
        if (Notification.permission !== 'granted' && !user.notificationsEnabled && !dismissed) {
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }
      }
    }

    async function requestPushPermissionManual() {
      const user = getCurrentUser();
      if (!user) return;

      if (window.fs && window.fs.initPushNotifications) {
        const granted = await window.fs.initPushNotifications(user.id, true);
        if (granted) {
          alert("Notificações ativadas com sucesso!");
        } else {
          alert("Não foi possível ativar as notificações ou a permissão foi negada no navegador.");
        }
      } else if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          user.notificationsEnabled = true;
          alert("Notificações ativadas com sucesso!");
        }
      }
      document.getElementById('push-permission-banner').classList.add('hidden');
      const currentContainer = document.getElementById('view-container');
      const activeNav = document.querySelector('.nav-btn.text-indigo-600');
      if (activeNav && activeNav.id === 'nav-perfil') {
        renderPerfil(currentContainer);
      }
    }

    function dismissPushBanner() {
      sessionStorage.setItem('ibvc_push_banner_dismissed', 'true');
      document.getElementById('push-permission-banner').classList.add('hidden');
    }

    function formatDateWithDayOfWeek(dateString) {
      if (!dateString) return '';
      if (dateString.includes('/')) return dateString; 

      const parts = dateString.split('-');
      if (parts.length !== 3) return dateString;

      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);

      const d = new Date(year, month, day);
      const daysOfWeek = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      const dayName = daysOfWeek[d.getDay()];

      const formattedDay = String(day).padStart(2, '0');
      const formattedMonth = String(month + 1).padStart(2, '0');

      return `${dayName}, ${formattedDay}/${formattedMonth}/${year}`;
    }

    const defaultLeader = {
      name: 'Líder Principal',
      email: 'louvor@ibvc.com',
      pass: '123',
      role: 'lider',
      photo: '',
      googleUid: null,
      notificationsEnabled: false,
      tempLeaderUntil: null
    };

    async function loadDataFromFirestore() {
      if (window.fs) {
        try {
          state.users = await window.fs.getUsers();
          
          if (state.users.length === 0) {
            const addedLeader = await window.fs.addUser(defaultLeader);
            state.users = [addedLeader];
          }

          state.avisos = await window.fs.getAvisos();
          state.escalas = await window.fs.getEscalas();
          state.indicacoes = await window.fs.getIndicacoes();
          return;
        } catch (err) {
          console.error("Erro ao ler do Firestore, carregando modo seguro local:", err);
        }
      }

      state.users = [{ id: 'leader_main_id', ...defaultLeader }];
    }

    async function initAppWithTimeout() {
      initTheme();
      const timeoutPromise = new Promise(resolve => setTimeout(resolve, 3500));
      await Promise.race([loadDataFromFirestore(), timeoutPromise]);

      if (state.users.length === 0) {
        state.users = [{ id: 'leader_main_id', ...defaultLeader }];
      }

      const user = getCurrentUser();
      if (user && window.fs && window.fs.initPushNotifications) {
        window.fs.initPushNotifications(user.id);
      }

      navigate(user ? 'feed' : 'login');
      if (user) {
        checkPushNotificationPermission();
      }
    }

    function getCurrentUser() {
      const session = JSON.parse(localStorage.getItem('ibvc_session') || sessionStorage.getItem('ibvc_session') || 'null');
      if (!session) return null;
      return state.users.find(u => u.id === session.id) || null;
    }

    function getUserNameById(userId) {
      if (!userId) return 'Aberto / Não definido';
      const u = state.users.find(item => item.id === userId);
      return u ? u.name : 'Usuário Removido';
    }

    function isLeader(user) {
      if (!user) return false;
      if (user.role === 'lider') return true;
      if (user.tempLeaderUntil && new Date(user.tempLeaderUntil) > new Date()) return true;
      return false;
    }

    async function navigate(viewName) {
      const currentUser = getCurrentUser();
      const container = document.getElementById('view-container');
      const header = document.getElementById('main-header');
      const bottomNav = document.getElementById('bottom-nav');

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-indigo-600', 'dark:text-indigo-400'));
      const activeNav = document.getElementById(`nav-${viewName}`);
      if (activeNav) activeNav.classList.add('text-indigo-600', 'dark:text-indigo-400');

      if (!currentUser && !['login', 'cadastro', 'esqueci-senha'].includes(viewName)) {
        return navigate('login');
      }

      if (['login', 'cadastro', 'esqueci-senha'].includes(viewName)) {
        header.classList.add('hidden');
        bottomNav.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
        bottomNav.classList.remove('hidden');
        checkPushNotificationPermission();
        
        document.getElementById('header-user-name').innerText = currentUser.name;
        document.getElementById('header-user-role').innerText = isLeader(currentUser) ? 'Líder' : 'Integrante';
        const avatar = document.getElementById('user-avatar');
        if (currentUser.photo) {
          avatar.style.backgroundImage = `url('${currentUser.photo}')`;
          avatar.innerText = '';
        } else {
          avatar.style.backgroundImage = 'none';
          avatar.innerText = currentUser.name.charAt(0).toUpperCase();
        }
      }

      switch (viewName) {
        case 'login': renderLogin(container); break;
        case 'cadastro': renderCadastro(container); break;
        case 'esqueci-senha': renderEsqueciSenha(container); break;
        case 'feed': renderFeed(container); break;
        case 'escalas': renderEscalas(container); break;
        case 'criar-escala': renderCriarEscala(container); break;
        case 'indicacoes': renderIndicacoes(container); break;
        case 'bio': renderBio(container); break;
        case 'perfil': renderPerfil(container); break;
        default: renderFeed(container);
      }
    }

    /* PLAYER DE YOUTUBE MODAL */
    function openPlayer(videoId, title) {
      const modal = document.getElementById('player-modal');
      const iframe = document.getElementById('youtube-iframe');
      const titleEl = document.getElementById('player-title');
      
      titleEl.innerText = title || 'Reproduzindo Vídeo';
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modal.classList.remove('hidden');
    }

    function closePlayer() {
      const modal = document.getElementById('player-modal');
      const iframe = document.getElementById('youtube-iframe');
      iframe.src = '';
      modal.classList.add('hidden');
    }

    /* LOGIN & AUTENTICAÇÃO COM GOOGLE */
    function renderLogin(container) {
      container.innerHTML = `
        <div class="flex flex-col justify-center min-h-[80vh] py-6">
          <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-600/10 dark:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-3 shadow-lg">
              <i class="ph ph-music-notes-plus"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-white">IBVC Louvor</h1>

    async function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value;

      if (window.fs) {
        try {
          state.users = await window.fs.getUsers();
        } catch (err) {
          console.error("Erro ao buscar usuários atualizados:", err);
        }
      }
      
      const user = state.users.find(u => (u.email.toLowerCase() === id.toLowerCase() || u.name.toLowerCase() === id.toLowerCase()) && u.pass === pass);
      
      if (user) {
        localStorage.setItem('ibvc_session', JSON.stringify({ id: user.id }));
        if (window.fs && window.fs.initPushNotifications) {
          window.fs.initPushNotifications(user.id);
        }
        navigate('feed');
      } else {
        alert('Credenciais inválidas!');
      }
    }

    async function handleGoogleLogin() {
      if (!window.auth || !window.googleProvider) {
        return alert("Autenticação Google não inicializada ou indisponível.");
      }

      try {
        const result = await window.signInWithPopup(window.auth, window.googleProvider);
        const gUser = result.user;

        if (window.fs) {
          state.users = await window.fs.getUsers();
        }

        let existingUser = state.users.find(u => (u.googleUid && u.googleUid === gUser.uid) || (u.email && u.email.toLowerCase() === gUser.email.toLowerCase()));

        if (existingUser) {
          if (!existingUser.googleUid) {
            existingUser.googleUid = gUser.uid;
            if (!existingUser.photo) existingUser.photo = gUser.photoURL || '';
            if (window.fs) {
              await window.fs.updateUser(existingUser.id, { googleUid: gUser.uid, photo: existingUser.photo });
            }
          }
          localStorage.setItem('ibvc_session', JSON.stringify({ id: existingUser.id }));
          if (window.fs && window.fs.initPushNotifications) {
            window.fs.initPushNotifications(existingUser.id);
          }
          navigate('feed');
        } else {
          const newUserObj = {
            name: gUser.displayName || 'Usuário Google',
            email: gUser.email,
            pass: 'google_authed',
            role: 'integrante',
            photo: gUser.photoURL || '',
            googleUid: gUser.uid,
            notificationsEnabled: false,
            tempLeaderUntil: null
          };

          let newUser = { id: 'user_' + Date.now(), ...newUserObj };
          if (window.fs) {
            newUser = await window.fs.addUser(newUserObj);
          }
          state.users.push(newUser);
          localStorage.setItem('ibvc_session', JSON.stringify({ id: newUser.id }));
          if (window.fs && window.fs.initPushNotifications) {
            window.fs.initPushNotifications(newUser.id);
          }
          navigate('feed');
        }
      } catch (err) {
        console.error("Erro no login Google:", err);
        alert("Não foi possível concluir o login via Google: " + err.message);
      }
    }

    function abrirModalAviso() {
      document.getElementById('aviso-edit-id').value = '';

      document.getElementById('modal-aviso').classList.remove('hidden');

    function fecharModalAviso() {
      document.getElementById('modal-aviso').classList.add('hidden');
    }

    function editarAviso(id) {
      const aviso = state.avisos.find(a => a.id === id);
      if (!aviso) return;
      document.getElementById('aviso-edit-id').value = aviso.id;
      document.getElementById('aviso-text').value = aviso.text;
      document.getElementById('modal-aviso-title').innerText = 'Editar aviso';
      document.getElementById('modal-aviso').classList.remove('hidden');
    }

    async function postAviso() {
      const id = document.getElementById('aviso-edit-id').value;
      const text = document.getElementById('aviso-text').value.trim();
      if (!text) return;

      const user = getCurrentUser();

      if (id) {
        const aviso = state.avisos.find(a => a.id === id);
        if (aviso) {
          aviso.text = text;
          if (window.fs) {
            try { await window.fs.updateAviso(id, { text }); } catch(err){}
          }
        }
      } else {
        const novoAviso = {
          text,
          authorId: user.id,
          date: new Date().toLocaleDateString('pt-BR')
        };

        if (window.fs) {
          try {
            const docRef = await window.fs.addAviso(novoAviso);
            novoAviso.id = docRef.id;
          } catch(err) { novoAviso.id = 'av_' + Date.now(); }
        } else {
          novoAviso.id = 'av_' + Date.now();
        }

        state.avisos.push(novoAviso);
        sendPushNotification("Novo Aviso no Mural", `${user.name}: "${text.length > 50 ? text.substring(0, 50) + '...' : text}"`);
      }

      fecharModalAviso();
      renderFeed(document.getElementById('view-container'));
    }

    async function excluirAviso(id) {
      if (!confirm('Deseja excluir este aviso?')) return;
      if (window.fs) {
        try { await window.fs.deleteAviso(id); } catch(err){}
      }
      state.avisos = state.avisos.filter(a => a.id !== id);
      renderFeed(document.getElementById('view-container'));
    }

                      <button onclick="excluirEscala('${escala.id}')" class="text-xs text-slate-400 hover:text-rose-500 transition" title="Excluir Escala"><i class="ph ph-trash text-base"></i></button>

                  <div class="grid grid-cols-2 gap-2 text-xs">
                    ${Object.entries(escala.instrumental || {}).map(([inst, data]) => `
                      <div class="bg-white dark:bg-slate-800/80 p-2 rounded-xl border border-slate-200 dark:border-slate-700/50">

                          <p class="text-xs font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            ${song.title}
                            <button onclick="openPlayer('${song.videoId}', '${song.title.replace(/'/g, "\\'")}')" class="text-rose-500 text-lg hover:text-rose-400 transition"><i class="ph ph-youtube-logo"></i></button>

                          <p class="text-[10px] text-slate-500 dark:text-slate-400">Ministro: <strong class="text-slate-700 dark:text-slate-300">${getUserNameById(song.ministerId)}</strong></p>

    async function excluirEscala(id) {
      if (!confirm('Deseja realmente remover esta escala?')) return;
      if (window.fs) {
        try { await window.fs.deleteEscala(id); } catch(err){}
      }
      state.escalas = state.escalas.filter(e => e.id !== id);
      renderEscalas(document.getElementById('view-container'));
    }

    function iniciarCriacaoEscala() {
      editingEscalaId = null;
      escalaDraft = { events: [], selectedInstruments: [], instrumental: {}, songs: [], vocalUserIds: [] };
      currentStepEscala = 1;
      navigate('criar-escala');
    }

    function editarEscala(id) {
      const escala = state.escalas.find(e => e.id === id);
      if (!escala) return;

      editingEscalaId = escala.id;
      escalaDraft = {
        events: JSON.parse(JSON.stringify(escala.events || [])),
        selectedInstruments: Object.keys(escala.instrumental || {}),
        instrumental: JSON.parse(JSON.stringify(escala.instrumental || {})),
        songs: JSON.parse(JSON.stringify(escala.songs || [])),
        vocalUserIds: [...(escala.vocalUserIds || [])]
      };
      currentStepEscala = 1;
      navigate('criar-escala');
    }

    /* MONTAGEM / EDIÇÃO DE ESCALA EM ETAPAS */
    function renderCriarEscala(container) {
      let html = `
        <div class="space-y-5">
          <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
            <h1 class="text-base font-bold text-slate-800 dark:text-white">${editingEscalaId ? 'Editar Escala' : 'Criar Nova Escala'}</h1>
            <button onclick="navigate('escalas')" class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white">Cancelar</button>
          </div>

          <div class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl flex justify-between text-[10px] font-semibold text-slate-500 dark:text-slate-400">
            <span class="${currentStepEscala === 1 ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">1. Datas</span>
            <span class="${currentStepEscala === 2 ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">2. Banda</span>
            <span class="${currentStepEscala === 3 ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">3. Louvores</span>
            <span class="${currentStepEscala === 4 ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">4. Vozes</span>
            <span class="${currentStepEscala === 5 ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">5. Resumo</span>
          </div>
      `;

      if (currentStepEscala === 1) html += renderStep1();
      else if (currentStepEscala === 2) html += renderStep2();
      else if (currentStepEscala === 3) html += renderStep3();
      else if (currentStepEscala === 4) html += renderStep4();
      else if (currentStepEscala === 5) html += renderStep5();

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderStep1() {
      return `
        <div class="space-y-4">
          <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">1. Selecione o Dia no Calendário e o Horário</h3>
          
          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3.5 rounded-2xl space-y-3 shadow-inner">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-500 dark:text-slate-400 block mb-1 font-medium">Toque para escolher a data</label>
                <input id="evt-date" type="date" onchange="updateDatePreview()" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">

              </div>
            </div>

            <div id="date-preview" class="hidden bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-500/30 rounded-xl p-2 text-center text-xs font-bold text-indigo-600 dark:text-indigo-300">
            </div>

            <button onclick="addEventTime()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2.5 rounded-xl font-semibold shadow transition">
              + Adicionar Dia na Escala
            </button>
          </div>

          <div class="space-y-2 mt-4">
            <h4 class="text-xs font-bold text-slate-500 dark:text-slate-400">Dias Adicionados nesta Escala:</h4>

            ${escalaDraft.events.map((evt, idx) => `
              <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs shadow-sm">
                <div>
                  <span class="font-bold text-indigo-600 dark:text-indigo-300 block">${formatDateWithDayOfWeek(evt.date)}</span>
                  <span class="text-[10px] text-slate-500 dark:text-slate-400">Horário: ${evt.time}</span>
                </div>
                <button onclick="escalaDraft.events.splice(${idx},1); renderCriarEscala(document.getElementById('view-container'))" class="text-rose-500 hover:text-rose-400 p-1">
                  <i class="ph ph-trash text-base"></i>
                </button>
              </div>
            `).join('')}
          </div>

          <button onclick="if(escalaDraft.events.length>0){ currentStepEscala=2; renderCriarEscala(document.getElementById('view-container')); } else alert('Adicione ao menos um dia!');" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl mt-6 text-xs shadow-lg shadow-indigo-600/20 transition">Próximo: Banda e Instrumental &rarr;</button>
        </div>
      `;
    }

    function updateDatePreview() {
      const val = document.getElementById('evt-date').value;
      const preview = document.getElementById('date-preview');
      if (val) {
        preview.innerText = `📅 Dia Selecionado: ${formatDateWithDayOfWeek(val)}`;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    }

    function addEventTime() {
      const date = document.getElementById('evt-date').value;
      const time = document.getElementById('evt-time').value;
      if (!date || !time) return alert('Por favor, selecione o dia e o horário.');
      
      escalaDraft.events.push({ date, time });
      renderCriarEscala(document.getElementById('view-container'));
    }

    const INSTRUMENTOS_DISPONIVEIS = ['Bateria', 'Baixo', 'Guitarra', 'Teclado', 'Violão'];

    function renderStep2() {
      return `
        <div class="space-y-4">

          <div class="flex flex-wrap gap-2">
            ${INSTRUMENTOS_DISPONIVEIS.map(inst => `
              <button onclick="toggleInstrument('${inst}')" class="px-3 py-2 rounded-xl text-xs font-medium border ${escalaDraft.selectedInstruments.includes(inst) ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-100 dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400'}">
                ${inst}
              </button>
            `).join('')}
          </div>

          <div class="space-y-3 mt-4">
            ${escalaDraft.selectedInstruments.map(inst => `
              <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-2xl space-y-2">
                <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 block">${inst}</span>
                <select onchange="assignMusician('${inst}', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white">
                  <option value="">Deixar em aberto</option>
                  ${state.users.map(u => `
                    <option value="${u.id}" ${escalaDraft.instrumental[inst]?.userId === u.id ? 'selected' : ''}>${u.name}</option>
                  `).join('')}
                </select>
              </div>
            `).join('')}
          </div>

          <div class="flex gap-2 mt-6">
            <button onclick="currentStepEscala=1; renderCriarEscala(document.getElementById('view-container'))" class="w-1/3 bg-slate-300 dark:bg-slate-700 text-slate-800 dark:text-white font-bold py-3 rounded-xl text-xs">&larr; Voltar</button>
            <button onclick="currentStepEscala=3; renderCriarEscala(document.getElementById('view-container'))" class="w-2/3 bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/20">Próximo: Músicas &rarr;</button>
          </div>
        </div>
      `;
    }

    function toggleInstrument(inst) {
      if (escalaDraft.selectedInstruments.includes(inst)) {
        escalaDraft.selectedInstruments = escalaDraft.selectedInstruments.filter(i => i !== inst);
        delete escalaDraft.instrumental[inst];
      } else {
        escalaDraft.selectedInstruments.push(inst);
      }
      renderCriarEscala(document.getElementById('view-container'));
    }

    function assignMusician(inst, userId) {
      escalaDraft.instrumental[inst] = { userId: userId || null };
    }

    function renderStep3() {
      return `
        <div class="space-y-4">
          <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">3. Músicas para o Louvor</h3>

          <div class="bg-slate-50 dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Pesquisar via YouTube</label>
            <div class="flex gap-2">
              <input id="yt-search-input" oninput="handleYouTubeInput()" type="text" placeholder="Nome da música..." class="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
              <button onclick="searchYouTube()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center justify-center"><i class="ph ph-magnifying-glass text-base"></i></button>
            </div>
            <div id="yt-results" class="space-y-2 mt-2"></div>
          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300">Músicas da Escala</h4>
            ${escalaDraft.songs.map((song, idx) => `
              <div class="bg-slate-50 dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 text-xs">
                <div class="flex justify-between font-bold text-indigo-600 dark:text-indigo-400">
                  <span class="truncate max-w-[200px]">${song.title}</span>
                  <button onclick="escalaDraft.songs.splice(${idx},1); renderCriarEscala(document.getElementById('view-container'))" class="text-rose-500"><i class="ph ph-trash"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Ministro</label>
                    <select onchange="escalaDraft.songs[${idx}].ministerId = this.value" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-white">
                      <option value="">Selecione...</option>
                      ${state.users.map(u => `<option value="${u.id}" ${song.ministerId === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Dia / Horário</label>
                    <select onchange="escalaDraft.songs[${idx}].eventTime = this.value" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-white">
                      <option value="">Selecione...</option>
                      ${escalaDraft.events.map(e => `<option value="${formatDateWithDayOfWeek(e.date)} ${e.time}" ${song.eventTime === `${formatDateWithDayOfWeek(e.date)}${e.time}` ? 'selected' : ''}>${formatDateWithDayOfWeek(e.date)} ${e.time}</option>`).join('')}
                    </select>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="flex gap-2 mt-6">
            <button onclick="currentStepEscala=2; renderCriarEscala(document.getElementById('view-container'))" class="w-1/3 bg-slate-300 dark:bg-slate-700 text-slate-800 dark:text-white font-bold py-3 rounded-xl text-xs">&larr; Voltar</button>
            <button onclick="currentStepEscala=4; renderCriarEscala(document.getElementById('view-container'))" class="w-2/3 bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/20">Próximo: Vocais &rarr;</button>
          </div>
        </div>
      `;

    function handleYouTubeInput() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const val = document.getElementById('yt-search-input').value.trim();
        if (val.length >= 3) searchYouTube();
      }, 500);
    }

    async function searchYouTube() {
      const query = document.getElementById('yt-search-input').value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('yt-results');
      resultsContainer.innerHTML = `<p class="text-xs text-slate-400">Buscando louvores...</p>`;

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          resultsContainer.innerHTML = data.items.map(item => `
            <div class="bg-white dark:bg-slate-800 p-2.5 rounded-xl flex justify-between items-center text-xs border border-slate-200 dark:border-slate-700">
              <div class="truncate max-w-[190px]">
                <p class="font-bold text-slate-800 dark:text-white truncate">${item.snippet.title}</p>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">${item.snippet.channelTitle}</p>
              </div>
              <button onclick="addSongToDraft('${item.snippet.title.replace(/'/g, "\\'")}', '${item.id.videoId}')" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] px-2.5 py-1.5 rounded-lg font-bold transition">+ Adicionar</button>
            </div>
          `).join('');
        }
      } catch (err) {
        resultsContainer.innerHTML = `<p class="text-xs text-rose-500">Erro na API do YouTube.</p>`;
      }
    }

    function addSongToDraft(title, videoId) {
      escalaDraft.songs.push({ title, videoId, ministerId: '', eventTime: '' });
      renderCriarEscala(document.getElementById('view-container'));
    }

    function renderStep4() {
      const ministerIds = escalaDraft.songs.map(s => s.ministerId).filter(Boolean);
      ministerIds.forEach(mId => {
        if (!escalaDraft.vocalUserIds.includes(mId)) {
          escalaDraft.vocalUserIds.push(mId);
        }
      });

      return `
        <div class="space-y-4">
          <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">4. Vocal e Backing Vocal</h3>

          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-2xl space-y-2">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Incluir integrante no vocal</label>
            <select onchange="addBackingVocal(this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white">
              <option value="">Selecione para incluir...</option>
              ${state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}

          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300">Equipe Escalada:</h4>
            ${escalaDraft.vocalUserIds.map((vId, idx) => {
              const isMinister = ministerIds.includes(vId);
              return `
                <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl flex justify-between items-center text-xs">
                  <span class="font-bold text-slate-800 dark:text-white">${getUserNameById(vId)}</span>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] ${isMinister ? 'bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border-emerald-500/30'} px-2 py-0.5 rounded-full border">
                      ${isMinister ? 'Ministro' : 'Backing'}
                    </span>
                    ${!isMinister ? `<button onclick="escalaDraft.vocalUserIds.splice(${idx},1); renderCriarEscala(document.getElementById('view-container'))" class="text-rose-500"><i class="ph ph-trash"></i></button>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex gap-2 mt-6">
            <button onclick="currentStepEscala=3; renderCriarEscala(document.getElementById('view-container'))" class="w-1/3 bg-slate-300 dark:bg-slate-700 text-slate-800 dark:text-white font-bold py-3 rounded-xl text-xs">&larr; Voltar</button>
            <button onclick="currentStepEscala=5; renderCriarEscala(document.getElementById('view-container'))" class="w-2/3 bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/20">Próximo: Resumo &rarr;</button>
          </div>
        </div>
      `;

    function addBackingVocal(userId) {
      if (!userId) return;
      if (!escalaDraft.vocalUserIds.includes(userId)) {
        escalaDraft.vocalUserIds.push(userId);
        renderCriarEscala(document.getElementById('view-container'));

    function renderStep5() {
      return `
        <div class="space-y-4">
          <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">5. Resumo e Publicação</h3>
          
          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl space-y-3 text-xs">
            <p class="font-bold text-indigo-600 dark:text-indigo-400">Dias Agendados</p>
            <div class="space-y-1">
              ${escalaDraft.events.map(e => `<p class="text-slate-700 dark:text-slate-200">📅 ${formatDateWithDayOfWeek(e.date)} às ${e.time}</p>`).join('')}

            <p class="font-bold text-indigo-600 dark:text-indigo-400 pt-2 border-t border-slate-200 dark:border-slate-800">Banda</p>
            ${Object.entries(escalaDraft.instrumental).map(([inst, data]) => `
              <p class="text-slate-700 dark:text-slate-200">${inst}:${getUserNameById(data.userId)}</p>

            ${escalaDraft.songs.map(s => `
              <p class="text-slate-700 dark:text-slate-200">${s.title} (${getUserNameById(s.ministerId)})</p>

            <p class="font-bold text-indigo-600 dark:text-indigo-400 pt-2 border-t border-slate-200 dark:border-slate-800">Equipe de Vozes</p>
            <p class="text-slate-700 dark:text-slate-200">${escalaDraft.vocalUserIds.map(id => getUserNameById(id)).join(', ')}</p>
          </div>

          <button onclick="publicarEscala()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-white py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 text-xs transition">

    async function publicarEscala() {
      const isEdit = !!editingEscalaId;
      if (editingEscalaId) {
        const index = state.escalas.findIndex(e => e.id === editingEscalaId);
        if (index !== -1) {
          state.escalas[index] = { id: editingEscalaId, ...escalaDraft };
          if (window.fs) {
            try { await window.fs.updateEscala(editingEscalaId, escalaDraft); } catch(err){}
          }
        }
        alert('Escala atualizada com sucesso!');
      } else {
        let novaEscala = { ...escalaDraft };
        if (window.fs) {
          try {
            const docRef = await window.fs.addEscala(escalaDraft);
            novaEscala.id = docRef.id;
          } catch(err) { novaEscala.id = 'esc_' + Date.now(); }
        } else {
          novaEscala.id = 'esc_' + Date.now();
        }
        state.escalas.push(novaEscala);
        alert('Escala publicada com sucesso!');
      }

      const dateStr = escalaDraft.events.map(e => formatDateWithDayOfWeek(e.date)).join(', ');
      sendPushNotification(
        isEdit ? "Escala Atualizada!" : "Nova Escala Publicada!",
        `Escala para ${dateStr || 'os próximos cultos'} foi ${isEdit ? 'atualizada' : 'publicada'}. Confira no app!`
      );

      editingEscalaId = null;
      currentStepEscala = 1;
      escalaDraft = { events: [], selectedInstruments: [], instrumental: {}, songs: [], vocalUserIds: [] };
      navigate('escalas');
    }

    /* INDICAÇÕES DE LOUVOR */
    function renderIndicacoes(container) {
      const currentUser = getCurrentUser();
      const userIsLeader = isLeader(currentUser);

      const indicacoesFiltradas = state.indicacoes.filter(ind => {
        if (userIsLeader) return true;
        return ind.createdBy === currentUser.id;
      });

      container.innerHTML = `
        <div class="space-y-5">
          <h1 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <i class="ph ph-music-notes text-indigo-600 dark:text-indigo-400"></i> Indicações de Louvor
          </h1>

          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl space-y-3 shadow-md">
            <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">Indicar novo louvor via YouTube</h3>
            <div class="flex gap-2">
              <input id="ind-yt-search" oninput="handleIndicationYouTubeInput()" type="text" placeholder="Nome da música..." class="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
              <button onclick="searchYouTubeForIndications()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center justify-center"><i class="ph ph-magnifying-glass text-base"></i></button>
            </div>
            <div id="ind-yt-results" class="space-y-2"></div>
          </div>

          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">Músicas Indicadas</h3>
              <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">${userIsLeader ? 'Visão de Líder (Todas)' : 'Suas indicações privadas'}</span>
            </div>

            ${indicacoesFiltradas.length === 0 ? '<p class="text-xs text-slate-400 dark:text-slate-500 py-2">Nenhuma indicação postada.</p>' : ''}
            ${indicacoesFiltradas.map(ind => {
              const canDelete = ind.createdBy === currentUser.id || userIsLeader;
              return `
                <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3.5 rounded-2xl flex justify-between items-center text-xs shadow-sm">
                  <div>
                    <p class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                      ${ind.title}
                      <button onclick="openPlayer('${ind.videoId}', '${ind.title.replace(/'/g, "\\'")}')" class="text-rose-500 text-lg hover:text-rose-400 transition"><i class="ph ph-youtube-logo"></i></button>
                    </p>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">Indicado por: <strong class="text-slate-700 dark:text-slate-300">${getUserNameById(ind.createdBy)}</strong></p>
                  </div>
                  ${canDelete ? `
                    <button onclick="removerIndicao('${ind.id}')" class="text-slate-400 hover:text-rose-500 p-2 text-base transition">
                      <i class="ph ph-trash"></i>
                    </button>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleIndicationYouTubeInput() {
      clearTimeout(indSearchTimeout);
      indSearchTimeout = setTimeout(() => {
        const val = document.getElementById('ind-yt-search').value.trim();
        if (val.length >= 3) searchYouTubeForIndications();
      }, 500);
    }

    async function searchYouTubeForIndications() {
      const query = document.getElementById('ind-yt-search').value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('ind-yt-results');
      resultsContainer.innerHTML = `<p class="text-xs text-slate-400">Buscando louvores...</p>`;

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        
        if (data.items && data.items.length > 0) {
          resultsContainer.innerHTML = data.items.map(item => `
            <div class="bg-white dark:bg-slate-800 p-2.5 rounded-xl flex justify-between items-center text-xs border border-slate-200 dark:border-slate-700">
              <div class="truncate max-w-[190px]">
                <p class="font-bold text-slate-800 dark:text-white truncate">${item.snippet.title}</p>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">${item.snippet.channelTitle}</p>
              </div>
              <button onclick="salvarIndicao('${item.snippet.title.replace(/'/g, "\\'")}', '${item.id.videoId}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] px-2.5 py-1.5 rounded-lg font-bold transition">+ Indicar</button>
            </div>
          `).join('');
        } else {
          resultsContainer.innerHTML = `<p class="text-xs text-slate-400">Nenhum resultado encontrado.</p>`;
        }
      } catch (err) {
        resultsContainer.innerHTML = `<p class="text-xs text-rose-500">Erro na busca do YouTube.</p>`;
      }
    }

    async function salvarIndicao(title, videoId) {
      const currentUser = getCurrentUser();
      const novaInd = {
        title,
        videoId,
        createdBy: currentUser.id,
        createdAt: new Date().toISOString()
      };

      if (window.fs) {
        try {
          const docRef = await window.fs.addIndicacao(novaInd);
          novaInd.id = docRef.id;
        } catch(err) { novaInd.id = 'ind_' + Date.now(); }
      } else {
        novaInd.id = 'ind_' + Date.now();
      }

      state.indicacoes.push(novaInd);
      sendPushNotification("Nova Indicação de Louvor", `${currentUser.name} indicou: "${title}"`);
      renderIndicacoes(document.getElementById('view-container'));
    }

    async function removerIndicao(id) {
      if (!confirm('Deseja remover esta indicação?')) return;
      if (window.fs) {
        try { await window.fs.deleteIndicacao(id); } catch(err){}
      }
      state.indicacoes = state.indicacoes.filter(i => i !== id);
      renderIndicacoes(document.getElementById('view-container'));
    }

    /* MINHA BIO (HABILIDADES E INSTRUMENTOS) */

      const currentUser = getCurrentUser();
      if (!currentUser.skills) currentUser.skills = [];

      container.innerHTML = `

          </h1>

          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl space-y-4 shadow-md">
            <div>
              <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Selecione suas habilidades no Louvor</h3>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">Marque o que você toca ou canta na igreja:</p>
            </div>

            <div class="space-y-2">
              ${['Vocal / Ministro', 'Backing Vocal', 'Bateria', 'Baixo', 'Guitarra', 'Teclado', 'Violão', 'Mídia / Som'].map(skill => {
                const checked = currentUser.skills.includes(skill);
                return `
                  <label class="flex items-center gap-3 p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer">
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSkill('${skill}')" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 border-slate-300">
                    <span class="text-xs font-semibold text-slate-800 dark:text-slate-200">${skill}</span>
                  </label>
                `;
              }).join('')}
            </div>

            <div>
              <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">Observações / Disponibilidade</label>
              <textarea id="bio-notes" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500" rows="3" placeholder="Ex: Não posso tocar no 2º domingo...">${currentUser.notes || ''}</textarea>
            </div>

            <button onclick="salvarBio()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-3 rounded-xl text-xs shadow-md transition">Salvar Bio</button>
          </div>
        </div>
      `;
    }

    async function toggleSkill(skill) {
      const user = getCurrentUser();
      if (!user.skills) user.skills = [];
      if (user.skills.includes(skill)) {
        user.skills = user.skills.filter(s => s !== skill);
      } else {
        user.skills.push(skill);
      }
    }

    async function salvarBio() {
      const user = getCurrentUser();
      const notes = document.getElementById('bio-notes').value.trim();
      user.notes = notes;

      if (window.fs) {
        try {
          await window.fs.updateUser(user.id, { skills: user.skills, notes });
        } catch(err) { console.error(err); }
      }

      alert('Bio atualizada com sucesso!');
    }

    /* PERFIL E GERENCIAMENTO DE INTEGRANTES / LIDERANÇA */

      const currentUser = getCurrentUser();

      container.innerHTML = `

          <!-- DADOS PESSOAIS DA CONTA -->

                <h3 class="font-bold text-sm text-slate-800 dark:text-white">${currentUser.name}</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">${currentUser.email}</p>
                <span class="inline-block mt-1 text-[10px] uppercase font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-500/10 px-2 py-0.5 rounded-full border border-indigo-500/20">
                  ${userIsLeader ? 'Líder do Louvor' : 'Integrante'}
                </span>
              </div>
            </div>

            <div class="border-t border-slate-200 dark:border-slate-800 pt-3 space-y-3">
              <div>
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">Foto de Perfil</label>
                <div class="flex flex-col gap-2">
                  <input type="file" id="profile-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                  <button onclick="document.getElementById('profile-file-input').click()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="ph ph-camera text-base"></i> Tirar Foto ou Escolher da Galeria
                  </button>
                  <span class="text-[10px] text-slate-400 text-center uppercase font-semibold">ou insira o link da foto</span>
                  <input id="profile-photo-url" type="url" value="${currentUser.photo || ''}" placeholder="https://exemplo.com/minha-foto.jpg" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
              </div>

              <div>
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">Nome</label>
                <input id="profile-name" type="text" value="${currentUser.name}" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
              </div>

              <div>
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">E-mail</label>
                <input id="profile-email" type="email" value="${currentUser.email}" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
              </div>

              <div>
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-1">Senha</label>
                <input id="profile-pass" type="password" value="${currentUser.pass}" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500">
              </div>

              <button onclick="salvarPerfil()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">Salvar Meus Dados</button>
            </div>
          </div>

          <!-- NOTIFICAÇÕES & INTEGRAÇÕES DE CONTA -->
          <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl space-y-3 shadow-md">
            <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">Conexões & Notificações</h3>
            
            <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              <div class="flex items-center gap-2">
                <i class="ph ph-bell-ringing text-lg text-indigo-600 dark:text-indigo-400"></i>
                <div>
                  <p class="text-xs font-bold text-slate-800 dark:text-slate-200">Notificações Push</p>
                  <p class="text-[10px] text-slate-500 dark:text-slate-400">${isPushEnabled ? 'Ativadas neste dispositivo' : 'Desativadas'}</p>
                </div>
              </div>
              <button onclick="requestPushPermissionManual()" class="px-3 py-1.5 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 border border-indigo-500/30 rounded-lg text-xs font-bold hover:bg-indigo-500/20 transition">
                ${isPushEnabled ? 'Atualizar Permissão' : 'Ativar Agora'}
              </button>
            </div>

            <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              <div class="flex items-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>

          ${userIsLeader ? `
            <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl space-y-3 shadow-md">
              <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300">Gerenciar Integrantes & Liderança Temporária</h3>
              <div class="space-y-3">
                ${state.users.map(u => {
                  const isUserLeaderTemp = u.tempLeaderUntil && new Date(u.tempLeaderUntil) > new Date();
                  return `
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 text-xs">
                      <div class="flex justify-between items-center">
                        <div>
                          <p class="font-bold text-slate-800 dark:text-white">${u.name}</p>
                          <p class="text-[10px] text-slate-500 dark:text-slate-400">${u.email} | ${u.role === 'lider' ? 'Líder Fixo' : (isUserLeaderTemp ? 'Líder Temporário' : 'Integrante')}</p>
                        </div>
                        ${u.role !== 'lider' ? `
                          <button onclick="promoverTemporario('${u.id}')" class="bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-500/20 text-[10px] font-bold px-2.5 py-1.5 rounded-lg border border-indigo-500/30 transition">
                            ${isUserLeaderTemp ? 'Renovar Liderança' : '+ Dar Liderança'}
                          </button>
                        ` : ''}
                      </div>

                      ${u.skills && u.skills.length > 0 ? `
                        <div class="flex flex-wrap gap-1">
                          ${u.skills.map(s => `<span class="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full">${s}</span>`).join('')}
                        </div>
                      ` : ''}

                      ${u.notes ? `<p class="text-[10px] italic text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 p-2 rounded-lg">Obs: ${u.notes}</p>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        return alert('Por favor, selecione um arquivo de imagem válido.');
      }

      // Limite de 2MB para salvar localmente via base64 de forma performática
      if (file.size > 2 * 1024 * 1024) {
        return alert('A imagem escolhida é muito grande. Escolha uma foto de até 2MB.');
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Photo = e.target.result;
        document.getElementById('profile-photo-url').value = base64Photo;
        const display = document.getElementById('profile-avatar-display');
        display.style.backgroundImage = `url('${base64Photo}')`;
        display.innerText = '';
      };
      reader.readAsDataURL(file);
    }

    async function salvarPerfil() {
      const currentUser = getCurrentUser();
      const photo = document.getElementById('profile-photo-url').value.trim();
      const name = document.getElementById('profile-name').value.trim();
      const email = document.getElementById('profile-email').value.trim();
      const pass = document.getElementById('profile-pass').value;

      if (!name || !email) return alert('Preencha o nome e o e-mail.');

      currentUser.photo = photo;
      currentUser.name = name;
      currentUser.email = email;
      currentUser.pass = pass;

      if (window.fs) {
        try {
          await window.fs.updateUser(currentUser.id, { photo, name, email, pass });
        } catch(err) { console.error(err); }
      }

      alert('Perfil atualizado com sucesso!');
      navigate('perfil');
    }

    async function promoverTemporario(userId) {
      const diasStr = prompt('Por quantos dias esse integrante será Líder Temporário?', '7');
      if (!diasStr) return;
      const dias = parseInt(diasStr, 10);
      if (isNaN(dias) || dias <= 0) return alert('Número de dias inválido.');

      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      const date = new Date();
      date.setDate(date.getDate() + dias);
      const tempLeaderUntil = date.toISOString();

      user.tempLeaderUntil = tempLeaderUntil;

      if (window.fs) {
        try {
          await window.fs.updateUser(userId, { tempLeaderUntil });
        } catch(err) { console.error(err); }
      }

      alert(`${user.name} agora é Líder Temporário por ${dias} dias!`);
      renderPerfil(document.getElementById('view-container'));
    }
  </script>
